[package]
name = "tcloud-core"
version = "0.9.0"
edition = "2024"

[dependencies]
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-native-roots", "migrate", "uuid", "chrono"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["migrate", "uuid", "chrono"] }
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }
grammers-client = "0.8.1"
grammers-session = "0.10.0"
grammers-mtsender = "0.8.1"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
hex = "0.4.3"
constant_time_eq = "0.4.2"
futures-util = "0.3.32"
argon2 = "0.5.3"
sha2 = "0.10.9"

[patch.crates-io]
core2 = { git = "https://github.com/bbqsrc/core2", rev = "545e84bcb0f235b12e21351e0c69767958efe2a7" }
