services:
  - type: web
    name: tcloud-core
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TCLOUD_DATABASE_URL
        sync: false
      - key: TCLOUD_API_TOKEN
        sync: false
      - key: TCLOUD_TELEGRAM_API_ID
        sync: false
      - key: TCLOUD_TELEGRAM_API_HASH
        sync: false
      - key: TCLOUD_SESSION_ENCRYPTION_KEY
        sync: false
      - key: TCLOUD_CORS_ORIGINS
        sync: false
      - key: TCLOUD_TELEGRAM_SESSION
        value: /tmp/tcloud/data/tcloud-telegram.session
