services:
  postgres:
    image: postgres:17-alpine
    container_name: tcloud-postgres
    restart: unless-stopped
    env_file:
      - .postgres.env
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - tcloud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tcloud_postgres_data: